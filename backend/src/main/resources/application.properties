server.port=8080

# H2 Database Configurations
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/careerquestdb;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD:}
spring.h2.console.enabled=${ENABLE_H2_CONSOLE:false}
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# JPA/Hibernate Configurations
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Configurations (Minimum 32 bytes for HS256)
jwt.secret=${JWT_SECRET:}
jwt.key-file=${JWT_KEY_FILE:./data/jwt.key}
jwt.expiration=86400000

# File upload properties
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

